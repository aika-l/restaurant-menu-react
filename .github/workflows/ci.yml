name: React CI/CD Pipeline

on:
  push:
    branches: [main, master, feature/react-18-upgrade]
  pull_request:
    branches: [main, master, feature/react-18-upgrade]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build
